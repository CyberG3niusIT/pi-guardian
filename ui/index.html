<!DOCTYPE html>
<html lang="de">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>PI Guardian – AI Platform</title>
    <style>
      /* System-local font declarations — no external CDN required.
         Falls through: JetBrains Mono → Fira Code → Cascadia Code → SF Mono → ui-monospace
         Falls through: Inter → system-ui → -apple-system → Segoe UI                       */
      @font-face {
        font-family: 'JetBrains Mono';
        src: local('JetBrains Mono'), local('JetBrainsMono-Regular');
        font-weight: 400 700;
        font-style: normal;
        font-display: swap;
      }
      @font-face {
        font-family: 'Inter';
        src: local('Inter'), local('Inter-Regular');
        font-weight: 400 700;
        font-style: normal;
        font-display: swap;
      }
      /* Prevent FOUC */
      html, body { background: #f1f2f6; margin: 0; padding: 0; }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
