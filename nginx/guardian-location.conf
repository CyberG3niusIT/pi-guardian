# PI Guardian Dashboard + API hinter dem bestehenden Router-vhost (Port 3001).
#
# Diesen location-Block in den vorhandenen server { ... }-Block in
# /etc/nginx/sites-available/pi-guardian einfuegen (neben location /api/),
# dann: sudo nginx -t && sudo systemctl reload nginx
#
# Der trailing slash in proxy_pass entfernt das /guardian/-Praefix, sodass
# das Dashboard (ausgeliefert unter Guardian-/) per relativen Fetches
# (metrics, services, containers, actions ...) same-origin auf :8072 trifft.

location /guardian/ {
    proxy_pass         http://127.0.0.1:8072/;
    proxy_http_version 1.1;
    proxy_set_header   Host              $http_host;
    proxy_set_header   X-Real-IP         $remote_addr;
    proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header   X-Forwarded-Proto $scheme;
    proxy_connect_timeout 10s;
    proxy_send_timeout    60s;
    proxy_read_timeout    60s;
}
