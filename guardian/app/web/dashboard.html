<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>PI Guardian</title>
<style>
  :root {
    --bg:#0f1115; --panel:#171a21; --panel2:#1d212b; --border:#262b36;
    --txt:#e6e9ef; --muted:#8a93a6; --ok:#2ecc71; --info:#3498db; --warn:#f1c40f; --crit:#e74c3c;
  }
  * { box-sizing:border-box; }
  body { margin:0; background:var(--bg); color:var(--txt); font:14px/1.5 system-ui,Segoe UI,Roboto,sans-serif; }
  header { display:flex; align-items:center; gap:16px; padding:16px 24px; border-bottom:1px solid var(--border); background:var(--panel); }
  header h1 { font-size:18px; margin:0; font-weight:600; }
  .badge { display:inline-block; padding:2px 10px; border-radius:999px; font-weight:600; font-size:12px; text-transform:uppercase; letter-spacing:.04em; }
  .ok{background:rgba(46,204,113,.15);color:var(--ok)} .info{background:rgba(52,152,219,.15);color:var(--info)}
  .warn{background:rgba(241,196,15,.15);color:var(--warn)} .crit{background:rgba(231,76,60,.15);color:var(--crit)}
  .muted{color:var(--muted)}
  main { padding:24px; max-width:1100px; margin:0 auto; }
  .grid { display:grid; grid-template-columns:repeat(auto-fit,minmax(220px,1fr)); gap:16px; margin-bottom:24px; }
  .card { background:var(--panel); border:1px solid var(--border); border-radius:12px; padding:16px; }
  .card h3 { margin:0 0 8px; font-size:12px; text-transform:uppercase; letter-spacing:.05em; color:var(--muted); }
  .big { font-size:24px; font-weight:700; }
  section { background:var(--panel); border:1px solid var(--border); border-radius:12px; padding:16px 20px; margin-bottom:20px; }
  section h2 { font-size:14px; margin:0 0 12px; }
  table { width:100%; border-collapse:collapse; }
  th,td { text-align:left; padding:7px 8px; border-bottom:1px solid var(--border); font-size:13px; }
  th { color:var(--muted); font-weight:500; }
  button { background:var(--panel2); color:var(--txt); border:1px solid var(--border); border-radius:8px; padding:6px 12px; cursor:pointer; font-size:13px; }
  button:hover { border-color:#3a4151; }
  button:disabled { opacity:.5; cursor:not-allowed; }
  .row { display:flex; align-items:center; gap:10px; flex-wrap:wrap; }
  input { background:var(--panel2); border:1px solid var(--border); color:var(--txt); border-radius:8px; padding:6px 10px; }
  .toast { position:fixed; right:20px; bottom:20px; background:var(--panel2); border:1px solid var(--border); border-radius:10px; padding:12px 16px; max-width:380px; display:none; }
  .pill { font-size:11px; padding:1px 7px; border-radius:6px; background:var(--panel2); border:1px solid var(--border); color:var(--muted); }
</style>
</head>
<body>
<header>
  <h1>🛡️ PI Guardian</h1>
  <span id="overall" class="badge muted">…</span>
  <span id="checked" class="muted" style="font-size:12px"></span>
  <span style="flex:1"></span>
  <input id="apikey" placeholder="API-Key (optional)" size="16" />
  <span id="dry" class="pill"></span>
</header>
<main>
  <div class="grid" id="metrics"></div>

  <section>
    <h2>systemd-Dienste</h2>
    <table><thead><tr><th>Dienst</th><th>Status</th><th>Sub</th><th></th></tr></thead>
    <tbody id="services"><tr><td class="muted" colspan="4">lädt…</td></tr></tbody></table>
  </section>

  <section>
    <h2>Docker-Container</h2>
    <table><thead><tr><th>Container</th><th>State</th><th>Health</th><th>Restarts</th><th></th></tr></thead>
    <tbody id="containers"><tr><td class="muted" colspan="5">lädt…</td></tr></tbody></table>
  </section>

  <section>
    <h2>Recovery-Aktionen <span id="actions-mode" class="pill"></span></h2>
    <table><thead><tr><th>ID</th><th>Typ</th><th>Ziel</th><th></th></tr></thead>
    <tbody id="actions"><tr><td class="muted" colspan="4">lädt…</td></tr></tbody></table>
    <h3 class="muted" style="margin:16px 0 6px;font-size:11px;text-transform:uppercase">Letzte Aktionen</h3>
    <table><thead><tr><th>Zeit</th><th>Aktion</th><th>Ergebnis</th></tr></thead>
    <tbody id="action-history"><tr><td class="muted" colspan="3">—</td></tr></tbody></table>
  </section>
</main>
<div id="toast" class="toast"></div>

<script>
const $ = (id) => document.getElementById(id);
const sev = (s) => s ? `<span class="badge ${s}">${s}</span>` : '<span class="muted">n/a</span>';
const apiKey = () => $('apikey').value.trim();
function headers(extra) { const h = extra||{}; const k = apiKey(); if (k) h['X-API-Key']=k; return h; }
function toast(msg) { const t=$('toast'); t.textContent=msg; t.style.display='block'; setTimeout(()=>t.style.display='none', 4000); }

async function getJSON(path) {
  const r = await fetch(path, { headers: headers() });
  if (!r.ok) throw new Error(path+' HTTP '+r.status);
  return r.json();
}

function fmtBytesPct(p) { return p==null ? '—' : p.toFixed(1)+'%'; }

async function loadStatus() {
  try {
    const s = await getJSON('status');
    $('overall').className = 'badge '+(s.guardian_status||'muted');
    $('overall').textContent = s.guardian_status||'?';
    $('checked').textContent = 'Stand: '+(s.checked_at||'').replace('T',' ').replace('Z',' UTC');
  } catch(e){ $('overall').textContent='offline'; $('overall').className='badge crit'; }
}

async function loadMetrics() {
  try {
    const m = await getJSON('metrics');
    const sy = m.system||{};
    const cards = [
      ['Gesamt-System', sev(m.status)],
      ['CPU', '<span class="big">'+fmtBytesPct(sy.cpu_usage_percent)+'</span>'],
      ['RAM', '<span class="big">'+fmtBytesPct(sy.memory_usage_percent)+'</span>'],
      ['Swap', '<span class="big">'+fmtBytesPct(sy.swap_usage_percent)+'</span>'],
      ['Disk', '<span class="big">'+fmtBytesPct(sy.disk_usage_percent)+'</span>'],
      ['Temperatur', '<span class="big">'+(sy.temperature_c!=null?sy.temperature_c.toFixed(1)+'°C':'—')+'</span>'],
    ];
    $('metrics').innerHTML = cards.map(([t,v])=>`<div class="card"><h3>${t}</h3>${v}</div>`).join('');
  } catch(e){ $('metrics').innerHTML='<div class="card crit">Metriken nicht verfügbar</div>'; }
}

async function loadServices() {
  try {
    const d = await getJSON('services');
    const units = (d.evaluation && d.evaluation.systemd && d.evaluation.systemd.units) || [];
    $('services').innerHTML = units.map(u=>`<tr>
      <td>${u.name} ${u.whitelisted?'':'<span class="pill">discovery</span>'}</td>
      <td>${sev(u.active_state==='active'?'ok':(u.active_state==='failed'?'crit':'warn'))} ${u.active_state}</td>
      <td class="muted">${u.sub_state}</td><td></td></tr>`).join('') || '<tr><td colspan="4" class="muted">keine</td></tr>';
  } catch(e){ $('services').innerHTML='<tr><td colspan="4" class="muted">nicht verfügbar</td></tr>'; }
}

async function loadContainers() {
  try {
    const d = await getJSON('containers');
    const cs = (d.evaluation && d.evaluation.docker && d.evaluation.docker.containers) || [];
    $('containers').innerHTML = cs.map(c=>`<tr>
      <td>${c.name} ${c.whitelisted?'':'<span class="pill">discovery</span>'}</td>
      <td>${sev(c.state==='running'?'ok':(c.state==='exited'||c.state==='dead'||c.state==='missing'?'crit':'warn'))} ${c.state}</td>
      <td class="muted">${c.health}</td><td class="muted">${c.restart_count??'—'}</td><td></td></tr>`).join('') || '<tr><td colspan="5" class="muted">keine</td></tr>';
  } catch(e){ $('containers').innerHTML='<tr><td colspan="5" class="muted">nicht verfügbar</td></tr>'; }
}

async function loadActions() {
  try {
    const d = await getJSON('actions');
    $('actions-mode').textContent = d.enabled ? (d.dry_run?'aktiv · dry-run':'aktiv · SCHARF') : 'deaktiviert';
    $('dry').textContent = d.enabled ? (d.dry_run?'dry-run':'scharf') : 'actions aus';
    $('actions').innerHTML = (d.whitelist||[]).map(r=>`<tr>
      <td>${r.id}</td><td class="muted">${r.kind}</td><td>${r.target}</td>
      <td><button onclick="runAction('${r.id}')">ausführen</button></td></tr>`).join('') || '<tr><td colspan="4" class="muted">keine</td></tr>';
    $('action-history').innerHTML = (d.history||[]).slice(0,10).map(h=>`<tr>
      <td class="muted">${(h.created_at||'').replace('T',' ').slice(0,19)}</td>
      <td>${h.action_id} → ${h.target}</td>
      <td>${sev(h.outcome==='executed'?'ok':(h.outcome==='failed'?'crit':(h.outcome==='dry_run'?'info':'warn')))} ${h.outcome}</td></tr>`).join('') || '<tr><td colspan="3" class="muted">—</td></tr>';
  } catch(e){ $('actions').innerHTML='<tr><td colspan="4" class="muted">nicht verfügbar</td></tr>'; }
}

async function runAction(id) {
  if (!confirm('Aktion "'+id+'" anstoßen? (Guardian entscheidet final)')) return;
  try {
    const r = await fetch('actions/execute', { method:'POST', headers: headers({'Content-Type':'application/json'}), body: JSON.stringify({action_id:id}) });
    if (r.status===401||r.status===403) { toast('Abgelehnt (Auth) – API-Key nötig.'); return; }
    const d = await r.json();
    toast('Ergebnis: '+d.outcome+(d.error?(' – '+d.error):''));
    loadActions();
  } catch(e){ toast('Fehler: '+e.message); }
}

function refresh(){ loadStatus(); loadMetrics(); loadServices(); loadContainers(); loadActions(); }
refresh();
setInterval(refresh, 15000);
</script>
</body>
</html>
